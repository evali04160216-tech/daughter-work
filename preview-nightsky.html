<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夜空貓咪預覽</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes pop { 0% { transform: scale(0.92); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
@keyframes twinkle {
  0%, 100% { opacity: 0.3; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.3); }
}
@keyframes drift {
  0%, 100% { transform: translate(0, 0); }
  33% { transform: translate(8px, -6px); }
  66% { transform: translate(-6px, 4px); }
}

html, body { width: 100%; height: 100%; }

body {
  font-family: 'Microsoft JhengHei', 'PingFang TC', 'Comic Sans MS', sans-serif;
  color: white;
  font-size: 15px;
  position: relative;
  overflow-x: hidden;
  min-height: 100vh;

  background-image:
    radial-gradient(ellipse at 20% 30%, rgba(186, 138, 240, 0.4) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 70%, rgba(255, 140, 200, 0.3) 0%, transparent 50%),
    linear-gradient(180deg, #1a0e2e 0%, #2d1b4e 30%, #3d2666 60%, #2d1b4e 100%);
  background-attachment: fixed;
}

.star {
  position: fixed;
  color: white;
  pointer-events: none;
  animation: twinkle 3s ease-in-out infinite;
  font-size: 12px;
  text-shadow: 0 0 8px rgba(255,255,255,0.8);
  z-index: 0;
}
.star.s1 { top: 8%; left: 12%; animation-delay: 0s; }
.star.s2 { top: 15%; right: 18%; animation-delay: 0.5s; font-size: 16px; }
.star.s3 { top: 26%; left: 8%; animation-delay: 1s; }
.star.s4 { top: 38%; right: 10%; animation-delay: 1.5s; font-size: 14px; }
.star.s5 { top: 55%; left: 18%; animation-delay: 2s; }
.star.s6 { top: 68%; right: 22%; animation-delay: 0.3s; font-size: 15px; }
.star.s7 { top: 82%; left: 10%; animation-delay: 1.2s; }
.star.s8 { top: 90%; right: 14%; animation-delay: 0.8s; font-size: 13px; }

.moon {
  position: fixed;
  top: 5%;
  right: 8%;
  font-size: 32px;
  animation: drift 12s ease-in-out infinite;
  filter: drop-shadow(0 0 15px rgba(255, 240, 180, 0.6));
  z-index: 0;
}

.container {
  max-width: 480px;
  margin: 0 auto;
  padding: 18px 14px 24px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  position: relative;
  z-index: 1;
}

.top-pill {
  text-align: center;
  margin-bottom: 16px;
  animation: pop 0.5s ease-out;
}
.top-pill .pill {
  display: inline-block;
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  padding: 11px 24px;
  border-radius: 30px;
  box-shadow: 0 4px 20px rgba(186, 138, 240, 0.3);
  border: 1px solid rgba(255, 255, 255, 0.25);
  font-size: 16px;
  color: white;
  font-weight: bold;
  letter-spacing: 2px;
  text-shadow: 0 2px 8px rgba(0,0,0,0.4);
}

.hero {
  flex: 1;
  min-height: 260px;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 12px 0;
}

.hero-cat {
  max-width: 320px;
  width: 100%;
  height: auto;
  filter: drop-shadow(0 12px 40px rgba(186, 138, 240, 0.6)) drop-shadow(0 0 30px rgba(255, 182, 213, 0.3));
  animation: float 4s ease-in-out infinite;
}

.bottom-stack { margin-top: auto; }

.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 12px;
  animation: pop 0.5s ease-out;
  animation-delay: 0.1s;
  animation-fill-mode: backwards;
}

.stat-card {
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 18px;
  padding: 12px 6px;
  text-align: center;
  border: 1px solid rgba(255, 255, 255, 0.2);
  box-shadow: 0 6px 20px rgba(186, 138, 240, 0.25);
}
.stat-card .icon { font-size: 22px; display: block; line-height: 1; }
.stat-card .label { font-size: 10px; color: rgba(255,255,255,0.75); margin: 4px 0 2px; font-weight: bold; }
.stat-card .value { font-size: 20px; font-weight: bold; letter-spacing: -0.5px; text-shadow: 0 2px 8px rgba(0,0,0,0.3); }
.stat-card.coin .value { color: #5DDBC4; }
.stat-card.todo .value { color: #FFD27A; }
.stat-card.wait .value { color: #E0A3FF; }

.main-card {
  background: rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-radius: 22px;
  padding: 12px;
  box-shadow: 0 10px 30px rgba(186, 138, 240, 0.35);
  border: 1px solid rgba(255, 255, 255, 0.25);
  animation: pop 0.5s ease-out;
  animation-delay: 0.2s;
  animation-fill-mode: backwards;
}

.tabs {
  display: flex;
  background: rgba(0, 0, 0, 0.25);
  border-radius: 14px;
  padding: 4px;
  margin-bottom: 12px;
}
.tab {
  flex: 1;
  padding: 9px 4px;
  text-align: center;
  border-radius: 10px;
  font-weight: bold;
  font-size: 12px;
  color: rgba(255,255,255,0.65);
}
.tab.active {
  background: linear-gradient(135deg, #FFB6D5, #C8A8E9);
  color: white;
  box-shadow: 0 3px 10px rgba(255, 182, 213, 0.5);
  text-shadow: 0 1px 4px rgba(0,0,0,0.2);
}
.tab .badge {
  display: inline-block;
  background: #FF4D7A;
  color: white;
  padding: 1px 6px;
  border-radius: 7px;
  font-size: 10px;
  margin-left: 2px;
  box-shadow: 0 2px 6px rgba(255, 77, 122, 0.4);
}
.tab.active .badge { background: white; color: #C5305E; }

.demo-task {
  background: rgba(255, 255, 255, 0.95);
  border-left: 4px solid #FFB347;
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 8px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
  color: #4A4458;
}
.demo-task .info { flex: 1; }
.demo-task .name { font-weight: bold; color: #4A4458; font-size: 14px; }
.demo-task .meta { font-size: 11px; color: #888; margin-top: 2px; }
.demo-task .price { font-size: 20px; font-weight: bold; color: #E91E8E; letter-spacing: -0.5px; }

.propose-btn {
  width: 100%;
  padding: 13px;
  background: linear-gradient(135deg, #FFB6D5, #E0A3FF);
  color: white;
  border: none;
  border-radius: 16px;
  font-size: 14px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 8px 22px rgba(224, 163, 255, 0.5);
  letter-spacing: 1px;
  margin-top: 4px;
  font-family: inherit;
  text-shadow: 0 1px 4px rgba(0,0,0,0.2);
}

.preview-tag {
  position: fixed;
  top: 14px;
  left: 14px;
  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(10px);
  color: #FFD27A;
  padding: 6px 12px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: bold;
  z-index: 100;
  border: 1px solid rgba(255, 210, 122, 0.3);
}
</style>
</head>
<body>

<span class="star s1">✦</span>
<span class="star s2">✧</span>
<span class="star s3">✦</span>
<span class="star s4">✧</span>
<span class="star s5">✦</span>
<span class="star s6">✧</span>
<span class="star s7">✦</span>
<span class="star s8">✧</span>
<span class="moon">🌙</span>

<div class="preview-tag">🌌 夜空版預覽</div>

<div class="container">

  <div class="top-pill">
    <div class="pill">🐱 我的貓咪任務本</div>
  </div>

  <div class="hero">
    <img src="./cat-login.png" alt="貓咪" class="hero-cat" onerror="this.style.display='none';">
  </div>

  <div class="bottom-stack">

    <div class="stats-grid">
      <div class="stat-card coin">
        <span class="icon">😺</span>
        <div class="label">可領貓咪幣</div>
        <div class="value">$30</div>
      </div>
      <div class="stat-card todo">
        <span class="icon">⏰</span>
        <div class="label">待完成</div>
        <div class="value">2</div>
      </div>
      <div class="stat-card wait">
        <span class="icon">📮</span>
        <div class="label">等核可</div>
        <div class="value">1</div>
      </div>
    </div>

    <div class="main-card">
      <div class="tabs">
        <div class="tab active">待完成 <span class="badge">2</span></div>
        <div class="tab">等核可</div>
        <div class="tab">已領取</div>
      </div>

      <div class="demo-task">
        <div class="info">
          <div class="name">掃地</div>
          <div class="meta">📍 今天 · 家事</div>
        </div>
        <div class="price">$10</div>
      </div>

      <div class="demo-task">
        <div class="info">
          <div class="name">折毛巾</div>
          <div class="meta">📅 週五 · 工作室</div>
        </div>
        <div class="price">$20</div>
      </div>

      <button class="propose-btn">💡 我想做別的(主動申請)</button>
    </div>

  </div>

</div>

</body>
</html>
