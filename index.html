<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐱 貓咪打工本</title>
<link rel="icon" type="image/png" href="./cat-mascot.png">
<link rel="stylesheet" href="./style.css">
<style>
.entry-app { padding: 24px 18px; min-height: 100%; display: flex; flex-direction: column; }
.entry-hero {
  flex: 1;
  min-height: 280px;
  pointer-events: none;
}
.entry-brand {
  text-align: center;
  margin-top: 8px;
  margin-bottom: 6px;
  animation: fade-up 0.6s ease-out;
}
.entry-brand h1 {
  font-size: 26px;
  color: #B8527A;
  letter-spacing: 6px;
  text-shadow: 0 2px 12px rgba(255, 255, 255, 0.8);
}
.entry-brand .sub {
  font-size: 12px;
  color: #B89090;
  letter-spacing: 2px;
  margin-top: 4px;
}
.entry-question {
  text-align: center;
  font-size: 13px;
  color: #B8527A;
  letter-spacing: 3px;
  font-weight: bold;
  margin: 14px 0 12px;
}
.id-cards {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding-bottom: 16px;
}
.id-card {
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(24px);
  -webkit-backdrop-filter: blur(24px);
  border-radius: 22px;
  padding: 16px 18px;
  border: 1.5px solid rgba(255, 255, 255, 0.9);
  box-shadow: 0 10px 28px rgba(212, 132, 174, 0.25);
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
  color: inherit;
  animation: fade-up 0.5s ease-out backwards;
}
.id-card:nth-child(1) { animation-delay: 0.1s; }
.id-card:nth-child(2) { animation-delay: 0.2s; }
.id-card:active { transform: scale(0.98); }
.id-card .ic-img {
  width: 56px;
  height: 56px;
  flex-shrink: 0;
}
.id-card .ic-img img { width: 100%; height: 100%; object-fit: contain; }
.id-card .ic-info { flex: 1; min-width: 0; }
.id-card .ic-title {
  font-size: 18px;
  font-weight: bold;
  letter-spacing: 2px;
  color: #B8527A;
  margin-bottom: 2px;
}
.id-card.parent .ic-title { color: #8E5BC8; }
.id-card .ic-desc {
  font-size: 11px;
  color: #B89090;
  letter-spacing: 1px;
}
.id-card .ic-arrow {
  font-size: 20px;
  color: #D4799F;
  font-weight: bold;
}
.id-card.parent .ic-arrow { color: #8E5BC8; }

.entry-tip {
  text-align: center;
  font-size: 11px;
  color: #B8A0B8;
  margin-top: 8px;
  letter-spacing: 1px;
}
</style>
</head>
<body>

<div class="deco deco-1"><img src="./icon-coin.png" alt=""></div>
<div class="deco deco-2"><img src="./icon-star.png" alt=""></div>
<div class="deco deco-3"><img src="./icon-music.png" alt=""></div>
<div class="deco deco-4"><img src="./icon-gift.png" alt=""></div>
<div class="deco deco-5"><img src="./icon-mail.png" alt=""></div>
<div class="deco deco-6"><img src="./icon-book.png" alt=""></div>

<div class="phone">
  <div class="entry-app">

    <div class="entry-hero"></div>

    <div class="entry-brand">
      <h1>貓咪打工本</h1>
      <div class="sub">~ 記錄每一份努力 ~</div>
    </div>

    <div class="entry-question">妳是誰呀?</div>

    <div class="id-cards">

      <a href="./child.html" class="id-card child">
        <div class="ic-img"><img src="./cat-mascot.png" alt=""></div>
        <div class="ic-info">
          <div class="ic-title">我是女兒</div>
          <div class="ic-desc">看任務、做任務、領貓咪幣</div>
        </div>
        <div class="ic-arrow">→</div>
      </a>

      <a href="./parent.html" class="id-card parent">
        <div class="ic-img"><img src="./icon-add.png" alt=""></div>
        <div class="ic-info">
          <div class="ic-title">我是爸媽</div>
          <div class="ic-desc">派任務、核可、發貓咪幣</div>
        </div>
        <div class="ic-arrow">→</div>
      </a>

    </div>

    <div class="entry-tip">🔒 兩邊都需要密碼才能進入</div>

  </div>
</div>

</body>
</html>
