<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>👧 我的貓咪任務本</title>
<link rel="icon" type="image/png" href="./cat-mascot.png">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div class="deco deco-1"><img src="./icon-coin.png" alt=""></div>
<div class="deco deco-2"><img src="./icon-star.png" alt=""></div>
<div class="deco deco-3"><img src="./icon-music.png" alt=""></div>
<div class="deco deco-4"><img src="./icon-gift.png" alt=""></div>
<div class="deco deco-5"><img src="./icon-mail.png" alt=""></div>
<div class="deco deco-6"><img src="./icon-book.png" alt=""></div>

<div class="phone">

<!-- =========== 登入頁 =========== -->
<div id="loginPage" class="app">
  <div class="hero-space"></div>
  <div class="login-card">
    <h2>👧 女兒登入</h2>
    <div class="sub">輸入密碼進入妳的任務本</div>
    <input id="loginPwd" type="password" maxlength="4" placeholder="• • • •" inputmode="numeric">
    <div class="err" id="loginErr"></div>
    <button class="cta-btn" onclick="doLogin()">
      <img src="./icon-check.png" alt="">
      <span>進入</span>
    </button>
    <button class="cta-btn secondary" style="margin-top: 8px;" onclick="location.href='./index.html'">
      <span>← 回首頁</span>
    </button>
  </div>
</div>

<!-- =========== 主畫面 =========== -->
<div id="mainPage" class="app hidden">

  <div class="fab-out" onclick="logout()">登出</div>
  <div class="fab-bell" id="bell" onclick="clearBell()">
    🔔
    <span class="red-dot"></span>
  </div>

  <div class="top-title"><div class="pill">我的任務本</div></div>

  <div class="hero-space"></div>

  <div class="stats">
    <div class="stat stat-coin">
      <div class="stat-icon"><img src="./icon-coin.png" alt=""></div>
      <div class="stat-label">可領</div>
      <div class="stat-value" id="sCoin">0<span class="unit"> 元</span></div>
    </div>
    <div class="stat stat-todo">
      <div class="stat-icon"><img src="./icon-todo.png" alt=""></div>
      <div class="stat-label">待完成</div>
      <div class="stat-value" id="sTodo">0</div>
    </div>
    <div class="stat stat-wait">
      <div class="stat-icon"><img src="./icon-mail.png" alt=""></div>
      <div class="stat-label">等核可</div>
      <div class="stat-value" id="sWait">0</div>
    </div>
  </div>

  <div class="main">
    <div class="tabs">
      <button class="tab active" data-tab="assigned" onclick="setTab('assigned')">待完成 <span class="badge" id="bAssigned">0</span></button>
      <button class="tab" data-tab="pending" onclick="setTab('pending')">等核可 <span class="badge" id="bPending">0</span></button>
      <button class="tab" data-tab="approved" onclick="setTab('approved')">已領取 <span class="badge" id="bApproved">0</span></button>
    </div>

    <div id="taskList"></div>

    <button class="cta-btn secondary" onclick="openPropose()">
      <img src="./icon-idea.png" alt="">
      <span>我想做別的(主動申請)</span>
    </button>
  </div>

</div>
</div>

<!-- =========== Modal: 主動申請 =========== -->
<div class="modal-bg" id="proposeModal">
  <div class="modal">
    <h3>💡 我想做別的</h3>
    <label>項目</label>
    <select id="propType">
      <option value="">請選擇</option>
    </select>
    <label>提議金額(讓爸媽參考)</label>
    <input id="propAmount" type="number" placeholder="0">
    <label>備註(選填)</label>
    <textarea id="propNote" rows="2" placeholder="想跟爸媽說的話"></textarea>
    <div class="modal-actions">
      <button class="cta-btn secondary" onclick="closeModal('proposeModal')">取消</button>
      <button class="cta-btn" onclick="submitPropose()">
        <img src="./icon-check.png" alt="">送出
      </button>
    </div>
  </div>
</div>

<!-- =========== 慶祝動畫 =========== -->
<div class="celebrate" id="celebrate">
  <img src="./icon-star.png" alt="">
  <div class="ce-text" id="ceText">太棒了!✨</div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ==================== 設定 ==================== */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxL6RMWh4sn2M6cAhJxAEImtbSupDh12SuAHojfoW0CRrW7VGDir5UfD3ioGQtlK8snaw/exec';
const ROLE = 'child';
let currentTab = 'assigned';
let allTasks = [];
let items = [];
let lastTaskCount = -1;

/* ==================== 登入 ==================== */
window.addEventListener('load', () => {
  const saved = localStorage.getItem('cw_child_login');
  if (saved === 'ok') {
    showMain();
  }
  document.getElementById('loginPwd').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
});

function doLogin() {
  const pwd = document.getElementById('loginPwd').value;
  const err = document.getElementById('loginErr');
  if (pwd !== '1234') {
    err.textContent = '密碼不對喔 🥺';
    document.getElementById('loginPwd').value = '';
    return;
  }
  localStorage.setItem('cw_child_login', 'ok');
  showMain();
}

function logout() {
  localStorage.removeItem('cw_child_login');
  location.reload();
}

function showMain() {
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('mainPage').classList.remove('hidden');
  loadAll();
  setInterval(loadAll, 30000); // 30 秒自動刷新
}

/* ==================== 載入 ==================== */
async function loadAll() {
  try {
    const r1 = await fetch(GAS_URL + '?action=list&role=child');
    const d1 = await r1.json();
    if (d1.ok) {
      allTasks = d1.data || [];
      // 通知檢查
      const newCount = allTasks.length;
      if (lastTaskCount !== -1 && newCount > lastTaskCount) {
        document.getElementById('bell').classList.add('has-new');
        showToast('🌸 有新任務唷!');
      }
      lastTaskCount = newCount;
      renderStats();
      renderList();
    }

    const r2 = await fetch(GAS_URL + '?action=itemsList');
    const d2 = await r2.json();
    if (d2.ok) {
      items = d2.data || [];
      const sel = document.getElementById('propType');
      sel.innerHTML = '<option value="">請選擇</option>' +
        items.map(i => `<option value="${i.name}">${i.name}</option>`).join('');
    }
  } catch (e) {
    console.error(e);
  }
}

/* ==================== 渲染 ==================== */
function renderStats() {
  const assigned = allTasks.filter(t => t.status === 'assigned' || t.status === 'rejected').length;
  const pending = allTasks.filter(t => t.status === 'done' || t.status === 'pending').length;
  const approved = allTasks.filter(t => t.status === 'approved').length;
  const coin = allTasks.filter(t => t.status === 'approved')
    .reduce((s, t) => s + Number(t.actualAmount || t.proposedAmount || 0), 0);

  document.getElementById('sCoin').innerHTML = coin + '<span class="unit"> 元</span>';
  document.getElementById('sTodo').textContent = assigned;
  document.getElementById('sWait').textContent = pending;

  document.getElementById('bAssigned').textContent = assigned;
  document.getElementById('bPending').textContent = pending;
  document.getElementById('bApproved').textContent = approved;
}

function setTab(t) {
  currentTab = t;
  document.querySelectorAll('.tab').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === t);
  });
  renderList();
}

function getIconForCategory(name) {
  if (!name) return 'icon-add.png';
  if (name.includes('掃') || name.includes('家事')) return 'icon-broom.png';
  if (name.includes('毛巾') || name.includes('工作室')) return 'icon-towel.png';
  if (name.includes('書') || name.includes('讀')) return 'icon-book.png';
  if (name.includes('琴') || name.includes('音') || name.includes('樂')) return 'icon-music.png';
  if (name.includes('垃圾') || name.includes('髮')) return 'icon-broom.png';
  return 'icon-add.png';
}

function getDueInfo(dueStr) {
  if (!dueStr) return null;
  const due = new Date(dueStr);
  const today = new Date();
  today.setHours(0,0,0,0);
  const diff = Math.round((due - today) / 86400000);
  if (diff < 0) return { text: '逾期', cls: 'late' };
  if (diff === 0) return { text: '今天', cls: '' };
  if (diff === 1) return { text: '明天', cls: '' };
  if (diff <= 7) return { text: `${diff} 天後`, cls: 'week' };
  const m = due.getMonth() + 1, d = due.getDate();
  return { text: `${m}/${d}`, cls: 'week' };
}

function renderList() {
  const list = document.getElementById('taskList');
  let filtered;
  if (currentTab === 'assigned') {
    filtered = allTasks.filter(t => t.status === 'assigned' || t.status === 'rejected');
  } else if (currentTab === 'pending') {
    filtered = allTasks.filter(t => t.status === 'done' || t.status === 'pending');
  } else {
    filtered = allTasks.filter(t => t.status === 'approved' || t.status === 'paid');
  }

  if (filtered.length === 0) {
    const msg = currentTab === 'assigned' ? '太棒了!沒有待辦任務' :
                currentTab === 'pending' ? '沒有等待中的任務' : '還沒有領取紀錄';
    list.innerHTML = `<div class="empty"><img src="./cat-mascot.png" alt=""><div class="e-text">${msg}</div></div>`;
    return;
  }

  list.innerHTML = filtered.map(t => {
    const due = getDueInfo(t.dueDate);
    const dueCls = !due ? '' : (due.cls === 'late' ? 'due-today' : (due.cls === '' ? 'due-today' : (due.cls === 'week' ? 'due-week' : 'due-soon')));
    const dueHtml = due ? `<span class="due-pill ${due.cls}">${due.text}</span>` : '';
    const cat = t.category ? `<span>${t.category}</span>` : '';
    const reject = t.status === 'rejected' ? `<span class="due-pill late">需重做</span>` : '';

    let actionBtn = '';
    if (currentTab === 'assigned') {
      actionBtn = `<button class="cta-btn success" style="margin-top:8px; padding:10px;" onclick="markDone('${t.id}')">
        <img src="./icon-check.png" alt=""><span>我做完了!</span>
      </button>`;
    }

    return `<div>
      <div class="task ${dueCls}">
        <div class="task-icon"><img src="./${getIconForCategory(t.itemName)}" alt=""></div>
        <div class="task-info">
          <div class="task-name">${t.itemName || '未命名'}</div>
          <div class="task-meta">${dueHtml}${cat}${reject}</div>
        </div>
        <div class="task-price">$${t.actualAmount || t.proposedAmount || 0}</div>
      </div>
      ${actionBtn}
    </div>`;
  }).join('');
}

/* ==================== 動作 ==================== */
async function markDone(id) {
  try {
    const r = await fetch(`${GAS_URL}?action=markDone&id=${id}`);
    const d = await r.json();
    if (d.ok) {
      celebrate('太棒了!等爸媽核可 ✨');
      loadAll();
    } else {
      showToast('失敗:' + (d.error || ''));
    }
  } catch (e) {
    showToast('網路出狀況了');
  }
}

function openPropose() {
  document.getElementById('propType').value = '';
  document.getElementById('propAmount').value = '';
  document.getElementById('propNote').value = '';
  document.getElementById('proposeModal').classList.add('open');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

async function submitPropose() {
  const name = document.getElementById('propType').value;
  const amount = document.getElementById('propAmount').value || 0;
  const note = document.getElementById('propNote').value || '';
  if (!name) { showToast('要先選項目喔'); return; }

  try {
    const url = `${GAS_URL}?action=propose&itemName=${encodeURIComponent(name)}&amount=${amount}&note=${encodeURIComponent(note)}`;
    const r = await fetch(url);
    const d = await r.json();
    if (d.ok) {
      closeModal('proposeModal');
      celebrate('已送出申請!等爸媽看看 💌');
      loadAll();
    } else {
      showToast('送出失敗');
    }
  } catch (e) {
    showToast('網路出狀況了');
  }
}

/* ==================== UI ==================== */
function celebrate(text) {
  document.getElementById('ceText').textContent = text;
  const c = document.getElementById('celebrate');
  c.classList.add('show');
  setTimeout(() => c.classList.remove('show'), 1800);
}

function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

function clearBell() {
  document.getElementById('bell').classList.remove('has-new');
}
</script>

</body>
</html>
